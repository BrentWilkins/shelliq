[workspace]
resolver = "3"
members = [
    "crates/shelliq",
    "crates/harvest",
    "crates/index",
    "crates/verify",
    "crates/syntax",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brentwilkins/shelliq"

[workspace.dependencies]
shelliq-harvest = { path = "crates/harvest" }
shelliq-index = { path = "crates/index" }
shelliq-verify = { path = "crates/verify" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
