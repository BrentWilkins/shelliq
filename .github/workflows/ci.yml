name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --workspace --all-features
      - name: Verify publishable packages
        if: runner.os == 'Linux'
        run: cargo package --locked --workspace --exclude shelliq

  shell:
    name: Shell integrations (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux shell tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zsh
      - name: Run integration tests
        run: /bin/bash shell/tests/run.bash
      - name: Run ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x shell/shelliq.bash shell/tests/run.bash shell/tests/suggest-widget.bash

  python-style:
    name: Python style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked development tools
        run: uv sync --frozen --only-dev
      - name: Check Python style
        run: uv run --frozen ruff check .
      - name: Check Python formatting
        run: uv run --frozen ruff format --check .

  model-runtime:
    name: Optional model runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: training/uv.lock
      - name: Install locked CPU runtime and tests
        run: uv sync --project training --frozen --no-group training
      - name: Test packaged runtime and platform selection
        run: >-
          uv run --project training --frozen --no-group training pytest
          training/tests/test_documentation_cross_encoder.py
          training/tests/test_model_runtime.py
      - name: Verify release-binary diagnostics
        run: cargo run --locked --release -p shelliq -- model doctor
