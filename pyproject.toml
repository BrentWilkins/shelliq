[project]
name = "shelliq-dev"
version = "0.1.0"
description = "Development tooling for shelliq. Holds the linters; ships nothing."
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]

# The canonical Python style for the repo. `training/pyproject.toml` extends this rather
# than restating it, so the two cannot drift apart.
[tool.ruff]
line-length = 130
extend-exclude = [
    "training/shelliq_training/modeling_qwen2_jax.py",
    "training/shelliq_training/modeling_qwen2_orig.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
