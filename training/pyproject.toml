[project]
name = "shelliq-training"
version = "0.1.0"
description = "JAX/Flax nnx fine-tuning for shelliq. Development only; never shipped to users."
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.0.1",
    "flax>=0.12.8",
    "grain>=0.2.18",
    "jax[cuda12]>=0.11.0",
    "numpy>=2.5.1",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.1",
    "safetensors>=0.8.0",
    "transformers>=5.14.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
